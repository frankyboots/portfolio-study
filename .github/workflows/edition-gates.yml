name: Edition gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lock the environment
        run: uv sync --locked
      - name: Obtain data/ie_data.xls (data/RUNLOG.md step 1)
        run: |
          set -euo pipefail
          # Browser-like user agent + retries: Wix edge protection has refused
          # bare-curl runner traffic; diagnose which leg fails and with what.
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          page_status="$(curl -fsSL -A "$ua" --retry 3 --retry-all-errors -w '%{http_code}' https://shillerdata.com/ -o /tmp/shiller_page.html)" || {
            echo "DIAG: page fetch failed: curl exit $? (HTTP ${page_status:-unknown})" >&2
            echo "DIAG: page head (first 500 bytes):" >&2
            head -c 500 /tmp/shiller_page.html >&2 2>/dev/null || echo "(empty)" >&2
            exit 1
          }
          url="$(grep -oE '(https?:)?//[^"<> ]*ie_data\.xls\?ver=[^"<> ]*' /tmp/shiller_page.html | head -n 1)"
          if [ -z "$url" ]; then
            echo "DIAG: no ie_data.xls ?ver= CDN blob href found on shillerdata.com (HTTP $page_status)" >&2
            echo "DIAG: page head (first 500 bytes):" >&2
            head -c 500 /tmp/shiller_page.html >&2
            exit 1
          fi
          # The live page serves a scheme-relative href (//host/...); normalize to absolute.
          case "$url" in
            //*) url="https:$url" ;;
          esac
          echo "blob URL: $url"
          curl -fsSL -A "$ua" --retry 3 --retry-all-errors "$url" -o data/ie_data.xls || {
            echo "DIAG: blob download failed for $url (curl exit $?)" >&2
            exit 1
          }
      - name: Byte-verify against the DATA.md section 1.1 pin
        run: |
          set -euo pipefail
          expected="$(grep -oE 'sha256: [0-9a-f]{64}' data/DATA.md | head -n 1 | cut -d' ' -f2)"
          actual="$(sha256sum data/ie_data.xls | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "vintage pin mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "vintage pin verified: $actual"
      - name: ruff lint
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy (zero errors; zero is the baseline)
        run: uv run mypy analysis scripts tests
      - name: pytest (a quality gate, deliberately not one of the eight)
        run: uv run pytest

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lock the environment
        run: uv sync --locked
      - name: Obtain data/ie_data.xls (data/RUNLOG.md step 1)
        run: |
          set -euo pipefail
          # Browser-like user agent + retries: Wix edge protection has refused
          # bare-curl runner traffic; diagnose which leg fails and with what.
          ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          page_status="$(curl -fsSL -A "$ua" --retry 3 --retry-all-errors -w '%{http_code}' https://shillerdata.com/ -o /tmp/shiller_page.html)" || {
            echo "DIAG: page fetch failed: curl exit $? (HTTP ${page_status:-unknown})" >&2
            echo "DIAG: page head (first 500 bytes):" >&2
            head -c 500 /tmp/shiller_page.html >&2 2>/dev/null || echo "(empty)" >&2
            exit 1
          }
          url="$(grep -oE '(https?:)?//[^"<> ]*ie_data\.xls\?ver=[^"<> ]*' /tmp/shiller_page.html | head -n 1)"
          if [ -z "$url" ]; then
            echo "DIAG: no ie_data.xls ?ver= CDN blob href found on shillerdata.com (HTTP $page_status)" >&2
            echo "DIAG: page head (first 500 bytes):" >&2
            head -c 500 /tmp/shiller_page.html >&2
            exit 1
          fi
          # The live page serves a scheme-relative href (//host/...); normalize to absolute.
          case "$url" in
            //*) url="https:$url" ;;
          esac
          echo "blob URL: $url"
          curl -fsSL -A "$ua" --retry 3 --retry-all-errors "$url" -o data/ie_data.xls || {
            echo "DIAG: blob download failed for $url (curl exit $?)" >&2
            exit 1
          }
      - name: Byte-verify against the DATA.md section 1.1 pin
        run: |
          set -euo pipefail
          expected="$(grep -oE 'sha256: [0-9a-f]{64}' data/DATA.md | head -n 1 | cut -d' ' -f2)"
          actual="$(sha256sum data/ie_data.xls | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "vintage pin mismatch: expected $expected, got $actual" >&2
            exit 1
          fi
          echo "vintage pin verified: $actual"
      - name: gate 1 -- vintage integrity
        run: uv run python scripts/check_vintage_integrity.py
      - name: gate 2 -- validation suite
        run: uv run python analysis/validate_data_md.py
      - name: gate 3 -- repro
        run: uv run python scripts/check_repro.py
      - name: gate 4 -- accessibility floor
        run: uv run python scripts/check_accessibility_floor.py
      - name: gate 5 -- render order
        run: uv run python scripts/check_render_order.py
      - name: gate 6 -- cross-doc consistency
        run: uv run python scripts/check_crossdoc_consistency.py
      - name: gate 7 -- export freshness
        run: uv run python scripts/check_export_freshness.py
      - name: gate 8 -- import wall
        run: uv run python scripts/check_import_walls.py

  editions:
    # Story 1.7 / AD-5, NFR5: editions are committed frozen trees; refuse
    # any modify/delete/append under an edition that exists at the base
    # ref. Not one of the eight AD-8 gates (the consistency test pins
    # that exactly), so it runs on the runner's system python3 -- the
    # guard is stdlib-only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: editions no-overwrite guard
        run: python3 scripts/check_editions.py
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
